[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "premarket-analog"
version = "0.1.0"
description = "Backtest a premarket gap-up analog pattern against historical price action."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
premarket-analog = "premarket_analog.cli:main"

[tool.setuptools.packages.find]
include = ["premarket_analog*"]
